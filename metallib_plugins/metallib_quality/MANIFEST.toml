description = "Audio quality labels for naming scripts: 16-44, 24-96, V0/V2 from the LAME header, 320K, VBR."
long_description = """
Adds `%_quality%` (per file), `%_lame_settings%` and `$album_quality()` (one label for the whole
album, or `Mixed`). MP3 V tiers come from the preset LAME recorded in its header, never guessed
from average bitrate.
"""
