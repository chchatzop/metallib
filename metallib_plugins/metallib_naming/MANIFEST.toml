description = "Helpers for the MetalLib file naming script: letter folder, album media, WEB/CD/LP source tag."
long_description = """
Adds `$first_letter()`, `$album_media()`, `$media_code()` and `$with_media()` for Picard's file naming
script, and ships the "MetalLib library layout" naming script (MetalLib.ptsp) to import in
Options -> File Naming. The naming rules themselves stay in the script, editable there.
"""
